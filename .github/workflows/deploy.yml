- name: PDFs e index.html
        run: |
          mkdir -p public
          
          find . -name "*.typ" -not -path "*/.*" | while read -r file; do
            clean="${file#./}"
            out="public/${clean%.typ}.pdf"
            mkdir -p "$(dirname "$out")"
            typst compile "$clean" "$out"
          done

          python .github/scripts/gen_index.py
