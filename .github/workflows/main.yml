name: Deploy PDFs

"on":
  push:
    branches:
      - main
    paths:
      - '**/*.typ'
      - '.github/scripts/gen_index.py'
      - '.github/workflows/main.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Generar PDFs e index
        run: |
          mkdir -p public
          find . -type f -name "*.typ" \
            \( -path "*/clases-practicas/*" -o -path "*/clases-teoricas/*" -o -path "*/guias/*" \) \
            | while read -r file; do
              clean="${file#./}"
              out="public/${clean%.typ}.pdf"
              mkdir -p "$(dirname "$out")"
              typst compile --root . "$clean" "$out"
          done
          python .github/scripts/gen_index.py
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
